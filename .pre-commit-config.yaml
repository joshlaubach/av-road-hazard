repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: openapi-current
        name: openapi.json is current
        entry: python -m tools.export_openapi --check
        language: system
        pass_filenames: false
        files: ^(api|fusion)/
      - id: no-push-to-main
        name: block direct commits to main
        entry: bash -c 'test "$(git rev-parse --abbrev-ref HEAD)" != main || { echo "Do not commit on main; use agent/<workstream> branches."; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
