# Dataset layout is supplied through a JSON sample index; grouping is required separately.
sample_index: null
splits_file: null
checkpoint_dir: null  # Must resolve outside the checkout.
run_id: null          # Set once per experiment; existing fold directories are refused.
oof_file: null
verify_hashes: true
model_name: efficientnet_b4
pretrained: true
input_size: 380
lr: 0.0001
weight_decay: 0.01
batch_size: 16
epochs: 50
head_dropout: 0.3
drop_path: 0.2
threshold: 0.5
patience: 7
min_delta: 0.0
num_workers: 0
# Tile training: set tile_index and tile_cache_dir (built by tools/make_tile_index.py and
# tools/build_tile_cache.py) to train on cached tiles; leave both null to train on whole images.
tile_index: null
tile_cache_dir: null
# Progress bar: null draws it only on a terminal; true or false forces it.
progress: null
# Local MLflow store (a .db file in an existing folder OUTSIDE this repository); null = off.
tracking_db: null
tracking_experiment: defects
horizontal_flip: 0.5
color_jitter: 0.1
test_fraction: 0.15
n_folds: 5
val_fraction: 0.10
# Tile labels (defects/tile_labels.py): a class is positive at overlap >= positive_overlap, clean at
# <= negative_overlap, and the tile is ignored in between. Overlap = intersection / smaller area.
positive_overlap: 0.25
negative_overlap: 0.05
# Tiles (defects/patches.py, defects/tile_index.py): 384 px native crops, at least 20% overlap. Training
# keeps every positive tile plus clean tiles: at most clean_per_positive x the image's positives,
# at least min_clean_per_image, chosen with the global seed. Evaluation keeps every clean tile.
tile_size: 384
tile_overlap: 0.2
clean_per_positive: 1.0
min_clean_per_image: 1
# Annotator-confirmed clean tiles to add to every fold's training pool (JSON list of
# {"image_id", "row", "col"}; tiles of that fold's validation or test images are skipped), each
# repeated extra_negatives_repeat times. null adds none.
extra_negatives: null
extra_negatives_repeat: 1
# Tile crop cache (defects/tile_cache.py): JPEG quality of the native-size tile crops.
cache_jpeg_quality: 95
