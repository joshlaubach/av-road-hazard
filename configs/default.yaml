# Single source of truth for paths, thresholds, seeds. Environment variables (.env) override where noted.
seed: 42
num_workers: 0            # read by data loaders; Windows needs 0, set higher on Linux/macOS

paths:
  data_dir: data          # env DATA_DIR overrides
  checkpoint_dir: checkpoints   # env CHECKPOINT_DIR overrides
  debug_dump_dir: null    # env DEBUG_DUMP_DIR overrides; null disables dumps

pipeline:
  use_stubs: true         # env USE_STUBS (1/0) overrides; real models arrive with workstreams A and B

defects:
  # Tile classifier checkpoint (best.pt with its best.json beside it); env DEFECT_CHECKPOINT overrides.
  # null = not set: find_defects fails with a clear message instead of guessing a path.
  classifier_checkpoint: null
  thresholds:             # per-class tile probability cutoffs in D00, D10, D20, D40 order; provisional (noisy-label analysis)
    D00: 0.90
    D10: 0.75
    D20: 0.65
    D40: 0.75
  max_object_cover: 0.30  # skip tiles covered more than this by detected objects
  min_road_cover: 0.4     # skip tiles with less road than this; provisional (148 annotated tiles)

api:
  max_upload_bytes: 10485760   # 10 MiB
  max_image_pixels: 25000000   # decoded pixel cap, checked before pixels are loaded (decompression bombs)
  allowed_content_types: ["image/jpeg", "image/png"]
  max_batch_files: 20

llm:
  backend: ollama         # env LLM_BACKEND: ollama | claude
  ollama_host: http://localhost:11434
  ollama_model: llama3.2-vision

qdrant:
  url: null               # env QDRANT_URL

logging:
  level: INFO             # env LOG_LEVEL
