# Settings for the detector fine-tune (ADR 0015): tools/finetune_detector.py trains,
# tools/eval_finetune.py scores. Provisional: chosen before any held-out result was seen.

model: fasterrcnn_mobilenet_v3_large_fpn   # the pinned COCO detector the fine-tune starts from
cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

train:
  seed: 42
  epochs: 12
  batch_size: 8
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 100       # the learning rate rises from 0 to lr over this many steps, then follows a cosine down
  grad_clip: 10.0
  amp: bf16               # mixed-precision math on the GPU (faster); "none" for full precision
  num_workers: 6
  flip: 0.5               # chance of a left-right flip
  jitter: 0.2             # brightness and contrast are each scaled by a factor in 1 +/- jitter

# Limits from ADR 0015 (decided 2026-10-26), used by tools/eval_finetune.py.
evaluation:
  old_classes_cutoff: 0.5
  new_classes: [barrier, traffic_cone]
  cutoff_grid: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]
  limits:
    min_precision: 0.70        # new classes: when it says cone or barrier, it is right this often
    min_recall: 0.40           # new classes: it finds this share of the clearly visible ones
    min_boxes: 20              # a scene counts for a class only with this many clearly visible boxes
    min_passing_scenes:        # scenes that must reach both limits on their own
      barrier: 2
      traffic_cone: 1
    max_recall_drop: 0.03      # old classes: at most this much recall lost against the zero-shot detector
    max_precision_drop: 0.05   # old classes: at most this much precision lost
