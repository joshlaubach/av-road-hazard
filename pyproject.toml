[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "av-road-hazard"
version = "0.1.0"
description = "Road-hazard detection for front-camera driving frames: objects + road defects, fused, indexed for multimodal RAG."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.3",
  "httpx>=0.27",  # the Ollama backend
  "qdrant-client>=1.9",  # the photo index (in memory or a server)
  "anthropic>=1.0",  # the Claude backend
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]
notebook = [
  "jupyterlab>=4",
  "nbformat>=5.9",
  "matplotlib>=3.8",
]
ml = [
  "torch>=2.3",
  "torchvision>=0.18",
  "torchmetrics>=1.4",
  "timm>=1.0",
  "tensorflow>=2.16",
  "tqdm>=4.66",
  "mlflow>=3.0",
  "nuscenes-devkit>=1.1",
  "segmentation-models-pytorch>=0.5",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
]
rag = [
  "open_clip_torch>=2.24",  # CLIP; the API runs on a stand-in embedder without it
]

[tool.setuptools.packages.find]
include = ["common*", "perception*", "defects*", "fusion*", "rag*", "api*", "eval*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["common", "perception", "defects", "fusion", "rag", "api", "eval", "tools", "tests"]

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torchvision.*",
  "timm.*",
  "tensorflow.*",
  "qdrant_client.*",
  "open_clip.*",
  "tqdm.*",
  "mlflow.*",
  "nuscenes.*",
  "segmentation_models_pytorch.*",
  "safetensors.*",
  "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["defects.dataset", "defects.tile_dataset", "defects.tile_predict"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
  "e2e: needs a running docker compose stack (set E2E_BASE_URL); excluded by default",
  "data: data validation checks",
  "ml: model smoke tests (CPU)",
]
