[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "av-road-hazard"
version = "0.1.0"
description = "Road-hazard detection for front-camera driving frames: objects + road defects, fused, indexed for multimodal RAG."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pip-tools>=7",
]
# ml, rag extras are added by workstreams A, B (torch, torchvision, timm, torchmetrics) and D (qdrant-client, open_clip).

[tool.setuptools.packages.find]
include = ["common*", "perception*", "defects*", "fusion*", "rag*", "api*", "eval*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["common", "perception", "defects", "fusion", "rag", "api", "eval", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
  "e2e: needs a running docker compose stack (set E2E_BASE_URL); excluded by default",
  "data: data validation checks, also run nightly",
  "ml: model smoke tests (CPU)",
]
