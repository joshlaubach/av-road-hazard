[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "av-road-hazard"
version = "0.1.0"
description = "Road-hazard detection for front-camera driving frames: objects + road defects, fused, indexed for multimodal RAG."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.3",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]
# RAG extras are added by workstream D.

[tool.setuptools.packages.find]
include = ["common*", "perception*", "defects*", "fusion*", "rag*", "api*", "eval*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["common", "perception", "defects", "fusion", "rag", "api", "eval", "tools", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "timm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "defects.dataset"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
  "e2e: needs a running docker compose stack (set E2E_BASE_URL); excluded by default",
  "data: data validation checks",
  "ml: model smoke tests (CPU)",
]
