name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=. --cov-report=term-missing

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: python -m tools.export_openapi --check

  web:
    # hashFiles is not allowed in job-level conditions, so the check is a step. No-op until workstream F adds web/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has_web
        run: test -f web/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.has_web.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.has_web.outputs.present == 'true'
        run: cd web && npm ci && npm run lint && npm run typecheck && npm run build

  docker-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml up -d --build api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pytest
      - run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          E2E_BASE_URL=http://localhost:8000 python -m pytest -m e2e -o addopts=-q
      - if: failure()
        run: docker compose -f docker/docker-compose.yml logs

  secrets-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.lock
      - name: npm audit (when web/ exists)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: cd web && npm audit --audit-level=high
