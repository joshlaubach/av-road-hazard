# Real models instead of stubs (CPU image). Mounts the weights read-only; none are baked into the image.
# Usage: docker compose -f docker/docker-compose.yml -f docker/compose.real.yml up -d --build api
# Needs: checkpoints/ (detector and road model), the chosen classifier in runs/tile-fold0-hn2/fold0/, and
# the OpenCLIP photo-search weights in your Hugging Face cache (HF_CACHE_DIR, default ~/.cache/huggingface/hub;
# fetched once by running Search on the host). The api container is offline: it never downloads anything.
# With --profile llm the answer writer runs in Ollama inside the stack (not published on the host, which may
# run its own Ollama on 11434); pull its model once: docker compose ... exec ollama ollama pull llama3.2
services:
  ollama:
    ports: !reset []
  api:
    build:
      args:
        WITH_ML: "1"
    environment:
      USE_STUBS: "0"
      DEFECT_CHECKPOINT: /app/classifier/best.pt
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../runs/tile-fold0-hn2/fold0:/app/classifier:ro
      - ${HF_CACHE_DIR:-${USERPROFILE:-${HOME}}/.cache/huggingface/hub}/models--laion--CLIP-ViT-B-32-laion2B-s34B-b79K:/hf/hub/models--laion--CLIP-ViT-B-32-laion2B-s34B-b79K:ro
