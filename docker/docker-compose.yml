# Local stack. `docker compose -f docker/docker-compose.yml up -d --build api` starts the stub API.
# Add --profile llm to include Ollama. CPU only here; GPU passthrough is in compose.gpu.yml.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      USE_STUBS: "1"
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ../data:/app/data
      - ../checkpoints:/app/checkpoints

  qdrant:
    image: qdrant/qdrant:v1.12.0   # tag not yet verified on a live pull; check at first compose up
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest    # pin an exact tag in workstream E
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  qdrant_storage:
  ollama_models:
